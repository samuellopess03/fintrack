name: fintrack

x-app-build: &app-build
  context: .
  dockerfile: infra/docker/api.Dockerfile

x-app-common-env: &app-common-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  RABBITMQ_URL: ${RABBITMQ_URL}
  JWT_SECRET: ${JWT_SECRET}
  LOG_LEVEL: ${LOG_LEVEL}
  OTEL_COLLECTOR_HOST: otel-collector

x-app-common-restart: &app-common-restart unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Dados e dependências da aplicação
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samuel -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Aplicação principal
  # ---------------------------------------------------------------------------
  api:
    build: *app-build
    environment:
      <<: *app-common-env
      NODE_ENV: production
      PORT: ${PORT}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      OTEL_SERVICE_NAME: fintrack-api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: *app-common-restart

  worker:
    build: *app-build
    command:
      [
        "node",
        "--import",
        "./backend/dist/src/shared/platform/observability/telemetry/tracing.js",
        "backend/dist/src/worker/worker.js",
      ]
    environment:
      <<: *app-common-env
      NODE_ENV: production
      OTEL_SERVICE_NAME: fintrack-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: *app-common-restart

  # ---------------------------------------------------------------------------
  # Observabilidade de traces
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./infra/observability/otel/otel-collector.yml:/etc/otel/otel-collector.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    restart: *app-common-restart

  # ---------------------------------------------------------------------------
  # Observabilidade de logs
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    user: "0"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml
      - loki_data:/var/loki
    ports:
      - "3100:3100"
    restart: *app-common-restart

  promtail:
    image: grafana/promtail:latest
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/observability/promtail/promtail.yml:/etc/promtail/promtail.yml
      - promtail_data:/var/lib/promtail
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: *app-common-restart

  # ---------------------------------------------------------------------------
  # Observabilidade de métricas e dashboards
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: *app-common-restart

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: *app-common-restart

  # ---------------------------------------------------------------------------
  # Backend de traces
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:latest
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    restart: *app-common-restart

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  redisinsight_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  promtail_data:
